name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Cross build amd64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -o /dev/null ./cmd/systemd2mqtt

      - name: Cross build arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -o /dev/null ./cmd/systemd2mqtt

      - name: Validate the example config
        run: go run ./cmd/systemd2mqtt --config config.example.yaml --check-config

      - name: Render the discovery payload
        run: go run ./cmd/systemd2mqtt --config config.example.yaml --dump-discovery > /dev/null

      - name: Check the committed polkit rule matches the example config
        run: go run ./cmd/systemd2mqtt --config config.example.yaml --print-polkit-rule | diff - deploy/10-systemd2mqtt.rules

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target
